name: Release

# Builds the portable .lgx for ghostmind_core and ghostmind on every platform
# Basecamp ships for and attaches them to a GitHub release, named
# `<module>-<variant>.lgx` so the catalog's publish-from-release can pick
# them up without rebuilding.
#
# Runs on a pushed `v*` tag, or by hand (workflow_dispatch) for a given tag.
#
# Windows is not in the matrix: the core links LEZ's wallet_ffi (Rust +
# risc0), and LEZ v0.3.1 publishes no Windows build of it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: darwin-arm64
            runs-on: macos-latest
          - variant: linux-amd64
            runs-on: ubuntu-latest
          - variant: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Flake inputs that reference the working tree refuse a shallow clone.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # The first core build compiles the LEZ wallet FFI and its risc0 deps;
      # the stock Linux runners run out of disk without this.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # DeterminateSystems rather than cachix/install-nix-action: the latter
      # trips over the macOS runners' pre-provisioned _nixbld users.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # risc0's Metal kernels need Xcode's Metal toolchain.
      - name: Ensure Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if /usr/bin/xcrun metal --version >/dev/null 2>&1; then
            echo "Metal Toolchain present"
            exit 0
          fi
          xcodebuild -downloadComponent MetalToolchain
          /usr/bin/xcrun metal --version

      # Portable bundles only: the dev bundle (`lgx`) points into /nix/store
      # and tags variants "-dev", which Basecamp rejects.
      - name: Build ghostmind_core
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          cd ghostmind-core
          out=$(nix build 'path:.#lgx-portable' --print-out-paths --no-link -L)
          cp "$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)" \
             "$GITHUB_WORKSPACE/_artifacts/ghostmind_core-${{ matrix.variant }}.lgx"

      # The UI's ghostmind_core input is a placeholder; build against this
      # checkout's core so both artifacts come from the same commit.
      - name: Build ghostmind (UI)
        run: |
          set -euo pipefail
          cd ghostmind-ui
          out=$(nix build 'path:.#lgx-portable' --print-out-paths --no-link -L \
                  --override-input ghostmind_core path:../ghostmind-core)
          cp "$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)" \
             "$GITHUB_WORKSPACE/_artifacts/ghostmind-${{ matrix.variant }}.lgx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lgx-${{ matrix.variant }}
          path: _artifacts/*.lgx
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lgx-*
          path: _artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _artifacts
          sha256sum *.lgx > SHA256SUMS && cat SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" *.lgx SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" *.lgx SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --title "Ghostmind $TAG" --generate-notes
          fi
